<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWallet</title>
    <link rel="icon" type="image/svg+xml" href="../imagenes/favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container py-5">
      <header class="mb-5 text-center">
        <h2 class="display-6">Registrar Transacción</h2>
        <p class="text-muted mb-0">
          Guarda una transacción para tu cuenta autenticada.
        </p>
      </header>

      <div class="section-card p-4 mb-4">
        <h4 class="mb-3">Datos de la transacción</h4>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="descripcionTransaccion"
              >Descripción</label
            >
            <input
              type="text"
              id="descripcionTransaccion"
              class="form-control form-control-sm"
              placeholder="Supermercado Vea"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label" for="montoTransaccion">Monto</label>
            <input
              type="number"
              id="montoTransaccion"
              class="form-control form-control-sm"
              min="0"
              step="0.01"
              placeholder="1500.50"
            />
          </div>

          <div class="col-md-3">
            <label class="form-label" for="monedaTransaccion">Moneda</label>
            <select
              id="monedaTransaccion"
              class="currency-select form-select form-select-sm"
            >
              <option value="USD" selected>USD</option>
              <option value="ARS">ARS</option>
              <option value="EUR">EUR</option>
              <option value="BRL">BRL</option>
            </select>
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button
            type="button"
            class="btn btn-theme btn-sm"
            onclick="registrarTransaccion()"
          >
            Registrar transacción
          </button>
          <button
            type="button"
            class="btn btn-outline-theme btn-sm"
            onclick="resetRegistroTransaccionForm()"
          >
            Limpiar formulario
          </button>
        </div>
      </div>

      <div
        id="resultadoRegistroTransaccion"
        class="section-card p-4 mt-4"
        style="display: none"
      >
        <h4 class="mb-3">Resultado</h4>
        <div
          class="p-3 rounded-3 bg-light shadow-sm"
          style="white-space: pre-wrap"
        ></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
