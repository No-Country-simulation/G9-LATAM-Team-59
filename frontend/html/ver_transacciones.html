<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWallet</title>
    <link rel="icon" type="image/svg+xml" href="../imagenes/favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container py-5">
      <header class="mb-5 text-center">
        <h2 class="display-6">Ver Transacciones</h2>
        <p class="text-muted mb-0">
          Consulta y elimina transacciones de tu cuenta autenticada por rango de
          fechas.
        </p>
      </header>

      <div class="section-card p-4 mb-4">
        <h4 class="mb-3">Filtros</h4>
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label" for="desdeTransacciones">Desde</label>
            <input
              type="date"
              id="desdeTransacciones"
              class="form-control form-control-sm"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label" for="hastaTransacciones">Hasta</label>
            <input
              type="date"
              id="hastaTransacciones"
              class="form-control form-control-sm"
            />
          </div>
          <div class="col-md-4 d-flex flex-wrap gap-2">
            <button
              type="button"
              class="btn btn-theme btn-sm"
              onclick="verTransaccionesFiltradas()"
            >
              Buscar
            </button>
            <button
              type="button"
              class="btn btn-outline-theme btn-sm"
              onclick="limpiarFiltrosTransacciones()"
            >
              Limpiar
            </button>
          </div>
        </div>
      </div>

      <div
        id="mensajeTransacciones"
        class="alert mt-3"
        style="display: none"
      ></div>

      <div class="section-card p-4 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Listado</h4>
          <span id="contadorTransacciones" class="text-muted small"></span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Descripción</th>
                <th scope="col">Monto</th>
                <th scope="col">Moneda</th>
                <th scope="col" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaTransaccionesBody"></tbody>
          </table>
        </div>

        <div id="estadoTransacciones" class="text-muted mt-3"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
