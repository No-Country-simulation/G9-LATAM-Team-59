<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWallet</title>
    <link rel="icon" type="image/svg+xml" href="../imagenes/favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container py-5">
      <header class="mb-5 text-center">
        <h2 class="display-6">Clasificar Transacciones</h2>
      </header>

      <div class="section-card p-4 mb-4">
        <h4 class="mb-3">Transacciones</h4>
        <div id="transacciones">
          <div class="transaccion mb-3">
            <label class="form-label">Descripción de la transacción</label>
            <input
              type="text"
              class="descripcion form-control form-control-sm mb-3"
              style="
                border: 2px solid #64748b !important;
                box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04) !important;
              "
            />

            <label class="form-label">Monto de la transacción</label>
            <input
              type="number"
              class="monto form-control form-control-sm mb-3"
              style="
                border: 2px solid #64748b !important;
                box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04) !important;
              "
              min="0"
              step="0.01"
            />

            <label class="form-label">Moneda</label>
            <select
              class="moneda currency-select form-select form-select-sm mb-3"
            >
              <option value="USD" selected>USD</option>
              <option value="EUR">EUR</option>
              <option value="ARS">ARS</option>
              <option value="BRL">BRL</option>
            </select>
            <hr />
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button
            type="button"
            class="btn btn-theme btn-sm"
            onclick="agregarTransaccion()"
          >
            Agregar transacción
          </button>
          <button
            type="button"
            class="btn btn-outline-theme btn-sm"
            onclick="eliminarTransaccion()"
          >
            Eliminar transacción
          </button>
          <button
            type="button"
            class="btn btn-outline-theme btn-sm"
            onclick="resetClasificacionForm()"
          >
            Limpiar formulario
          </button>
          <button
            type="button"
            class="btn btn-theme btn-sm"
            onclick="enviarTransacciones()"
          >
            Enviar
          </button>
        </div>
      </div>

      <div
        id="resultadoContainerClasificacion"
        class="section-card p-4 mt-4"
        style="display: none"
      >
        <h4 class="mb-3">Resultado</h4>
        <div
          id="resultadoClasificacion"
          class="p-3 rounded-3 bg-light shadow-sm"
          style="white-space: pre-wrap; display: none"
        ></div>
      </div>
    </div>

    <script type="module" src="../js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
