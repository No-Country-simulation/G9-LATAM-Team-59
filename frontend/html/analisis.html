<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWallet</title>
    <link rel="icon" type="image/svg+xml" href="../imagenes/favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container py-5">
      <header class="mb-5 text-center">
        <h2 class="display-6">Análisis Financiero</h2>
      </header>

      <div class="section-card p-4 mb-4">
        <h4 class="mb-3">Datos financieros</h4>
        <label class="form-label">Ingreso mensual</label>
        <input
          type="number"
          id="ingreso"
          class="form-control form-control-sm mb-3"
          style="
            border: 2px solid #64748b !important;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04) !important;
          "
          min="0"
          step="0.01"
        />

        <label class="form-label">Moneda ingreso mensual</label>
        <select
          id="monedaIngresoMensual"
          class="currency-select form-select form-select-sm mb-3"
        >
          <option value="USD" selected>USD</option>
          <option value="EUR">EUR</option>
          <option value="ARS">ARS</option>
          <option value="BRL">BRL</option>
        </select>

        <label class="form-label">Nivel de endeudamiento (%)</label>
        <input
          type="number"
          id="endeudamiento"
          class="form-control form-control-sm mb-3"
          style="
            border: 2px solid #64748b !important;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04) !important;
          "
          min="0"
          step="0.01"
        />

        <label class="form-label">Frecuencia de ahorro</label>
        <select id="ahorro" class="form-select form-select-sm mb-3">
          <option>Nula</option>
          <option>Baja</option>
          <option>Media</option>
          <option>Alta</option>
        </select>
      </div>

      <div class="section-card p-4 mb-4">
        <h4 class="mb-3">Transacciones</h4>
        <div id="transaccionesAnalisis">
          <div class="transaccion-analisis mb-3">
            <label class="form-label">Descripción de la transacción</label>
            <input
              type="text"
              class="descripcion-analisis form-control form-control-sm mb-3"
              style="
                border: 2px solid #64748b !important;
                box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04) !important;
              "
            />

            <label class="form-label">Monto</label>
            <input
              type="number"
              class="monto-analisis form-control form-control-sm mb-3"
              style="
                border: 2px solid #64748b !important;
                box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.04) !important;
              "
              min="0"
              step="0.01"
            />
            <label class="form-label">Moneda</label>
            <select
              class="moneda-analisis currency-select form-select form-select-sm mb-3"
            >
              <option value="USD" selected>USD</option>
              <option value="EUR">EUR</option>
              <option value="ARS">ARS</option>
              <option value="BRL">BRL</option>
            </select>
            <hr />
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <button
            type="button"
            class="btn btn-theme btn-sm"
            onclick="agregarTransaccionAnalisis()"
          >
            Agregar transacción
          </button>
          <button
            type="button"
            class="btn btn-outline-theme btn-sm"
            onclick="eliminarTransaccionAnalisis()"
          >
            Eliminar transacción
          </button>
          <button
            type="button"
            class="btn btn-outline-theme btn-sm"
            onclick="resetAnalisisForm()"
          >
            Limpiar formulario
          </button>
          <button
            type="button"
            class="btn btn-theme btn-sm"
            onclick="enviarDatos()"
          >
            Analizar mis finanzas
          </button>
        </div>
      </div>

      <div
        id="resultadoAnalisis"
        class="section-card p-4 mt-4"
        style="white-space: pre-wrap; display: none"
      >
        <h4 class="mb-3">Resultado</h4>
        <div
          class="p-3 rounded-3 bg-light shadow-sm"
          style="white-space: pre-wrap"
        ></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
