<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWallet</title>
    <link rel="icon" type="image/svg+xml" href="../imagenes/favicon.svg" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container py-5">
      <header class="mb-5 text-center">
        <h2 class="display-6">Análisis Financiero Histórico</h2>
        <p class="text-muted mb-0">
          Evalúa tu salud financiera con tus transacciones históricas por rango
          de fechas.
        </p>
      </header>

      <div class="section-card p-4 mb-4">
        <h4 class="mb-3">Parámetros de análisis</h4>

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="ingresoHistorico"
              >Ingreso mensual</label
            >
            <input
              type="number"
              step="0.01"
              min="0"
              id="ingresoHistorico"
              class="form-control form-control-sm"
              placeholder="4500.00"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="monedaIngresoHistorico"
              >Moneda de ingreso mensual</label
            >
            <select
              id="monedaIngresoHistorico"
              class="currency-select form-select form-select-sm"
            >
              <option value="USD">USD</option>
              <option value="ARS">ARS</option>
              <option value="EUR">EUR</option>
              <option value="BRL">BRL</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="endeudamientoHistorico"
              >Nivel de endeudamiento (%)</label
            >
            <input
              type="number"
              step="0.01"
              min="0"
              id="endeudamientoHistorico"
              class="form-control form-control-sm"
              placeholder="25.0"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="ahorroHistorico"
              >Frecuencia de ahorro</label
            >
            <select id="ahorroHistorico" class="form-select form-select-sm">
              <option value="Nula">Nula</option>
              <option value="Baja">Baja</option>
              <option value="Media" selected>Media</option>
              <option value="Alta">Alta</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="desdeHistorico">Desde</label>
            <input
              type="date"
              id="desdeHistorico"
              class="form-control form-control-sm"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="hastaHistorico">Hasta</label>
            <input
              type="date"
              id="hastaHistorico"
              class="form-control form-control-sm"
            />
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button
            type="button"
            class="btn btn-theme btn-sm"
            onclick="enviarAnalisisHistoricoMisTransacciones()"
          >
            Analizar mis transacciones
          </button>
          <button
            type="button"
            class="btn btn-outline-theme btn-sm"
            onclick="resetAnalisisHistoricoForm()"
          >
            Limpiar formulario
          </button>
        </div>
      </div>

      <div
        id="resultadoAnalisisHistorico"
        class="section-card p-4 mt-4"
        style="display: none"
      >
        <h4 class="mb-3">Resultado</h4>
        <div
          class="p-3 rounded-3 bg-light shadow-sm"
          style="white-space: pre-wrap"
        ></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/script.js"></script>
  </body>
</html>
