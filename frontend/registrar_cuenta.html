<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartWallet</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="nav">
      <a class="nav-link" href="index.html">SMART WALLET</a>
      <a class="nav-link" href="clasificacion.html"
        >Clasificación de transacciones</a
      >
      <a class="nav-link" href="analisis.html">Análisis financiero</a>
      <a class="nav-link" href="registrar_cuenta.html">Registrar Cuenta</a>
      <a class="nav-link" href="iniciar_sesion.html">Iniciar Sesión</a>
    </nav>

    <main class="container py-5">
      <section class="section-card p-4 p-md-5 mx-auto" style="max-width: 540px">
        <div class="text-center mb-4">
          <span
            class="badge rounded-pill px-3 py-2"
            style="background: #dbeafe; color: #1d4ed8"
          >
            Crea tu cuenta
          </span>
          <h2 class="mt-3 mb-2 fw-bold">Registrar Cuenta</h2>
          <p class="text-muted mb-0">
            Completa el formulario para comenzar a usar SmartWallet.
          </p>
        </div>

        <form class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold" for="email"
              >Correo electrónico</label
            >
            <input
              class="form-control form-control-lg rounded-3"
              type="email"
              id="email"
              placeholder="tu@correo.com"
            />
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold" for="password"
              >Contraseña</label
            >
            <input
              class="form-control form-control-lg rounded-3"
              type="password"
              id="password"
              placeholder="••••••••"
            />
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold" for="username"
              >Nombre de usuario</label
            >
            <input
              class="form-control form-control-lg rounded-3"
              type="text"
              id="username"
              placeholder="Tu nombre"
            />
          </div>

          <div class="col-12">
            <div
              id="mensaje-alerta"
              class="alert alert-danger mt-3"
              style="display: none"
            ></div>
          </div>

          <div class="col-12 d-grid">
            <button
              class="btn btn-primary btn-lg rounded-3 fw-semibold"
              type="button"
              onclick="registrarCuenta()"
            >
              Registrarme
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
